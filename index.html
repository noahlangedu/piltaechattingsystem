<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILTAE CHAT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #08080d;
    --panel: #101018;
    --panel2: #151520;
    --border: #28283a;
    --purple: #9b5cff;
    --purple2: #6d35c9;
    --orange: #ff7a18;
    --green: #45e38b;
    --red: #ff4d67;
    --text: #f4f2ff;
    --muted: #9290a3;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top left, rgba(155,92,255,.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,122,24,.08), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    height: 100vh;
    overflow: hidden;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* AUTH */

#authScreen {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.authBox {
    width: 420px;
    max-width: 92%;
    background: rgba(16,16,24,.95);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 20px 80px rgba(0,0,0,.5);
}

.logo {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 5px;
    text-align: center;
    color: var(--purple);
    text-shadow: 0 0 25px rgba(155,92,255,.45);
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin: 8px 0 28px;
}

.authBox input {
    width: 100%;
    margin-bottom: 12px;
    padding: 13px;
    background: #0a0a10;
    color: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
}

.authBox input:focus {
    border-color: var(--purple);
}

.primaryBtn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    background: linear-gradient(135deg,var(--purple),var(--orange));
}

.secondaryBtn {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: white;
    background: var(--panel2);
    margin-top: 10px;
}
